<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./style.css" />
  <script src="https://kit.fontawesome.com/bf7220ad33.js" crossorigin="anonymous"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun&display=swap" rel="stylesheet">
  <title>Positioned Layout Exercise 2 TechUp Chatroom</title>
</head>

<body>
  <header class="header">
    <h1 class="header__title">Techup Chatroom</h1>
  </header>

  <main class="chat">
    <div class="bubble bubble--right bubble--green bubble--tail">
      สวัสดีจ้า
    </div>

    <div class="bubble bubble--right bubble--light-gray">
      Coding สนุกจังเลย
      <button type="button" class="bubble__close" aria-label="Close message">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <div class="bubble bubble--right bubble--green">
      😍😍
    </div>

    <div class="bubble bubble--left bubble--gray">
      😍
    </div>

    <div class="bubble bubble--left bubble--gray bubble--left-2">
      😘
    </div>
  </main>
</body>

</html>
