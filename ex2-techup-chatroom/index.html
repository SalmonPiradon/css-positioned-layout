<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Techup Chatroom</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="chat-app">
    <header class="chat-header">Techup Chatroom</header>
    <main class="chat-body">

      <div class="msg-row right">
        <div class="bubble-wrap">
          <div class="bubble green">สวัสดีจ้า</div>
          <div class="bubble-tail bubble-tail-right"></div>
        </div>
      </div>

      <div class="msg-row right">
        <div class="bubble-wrap">
          <div class="bubble gray-light">Coding สนุกจังเลย</div>
          <div class="bubble-tail bubble-tail-right gray-tail"></div>
          <div class="x-btn x-btn-right">✕</div>
        </div>
      </div>

      <div class="msg-row right">
        <div class="bubble-wrap">
          <div class="bubble green">😘 😍</div>
          <div class="bubble-tail bubble-tail-right"></div>
        </div>
      </div>

      <div class="msg-row left">
        <div class="bubble-wrap">
          <div class="bubble gray">😍</div>
          <div class="bubble-tail bubble-tail-left"></div>
        </div>
      </div>

      <div class="msg-row left">
        <div class="bubble-wrap">
          <div class="bubble gray">😘</div>
          <div class="bubble-tail bubble-tail-left"></div>
        </div>
      </div>

    </main>
  </div>

</body>
</html>
